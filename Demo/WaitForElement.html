<!DOCTYPE html>
<html>

<head></head>

<body>
   <div id="parent">
      <div id="initial">Already Present</div>
   </div>
</body>
<script>
   let div = document.querySelector("#parent");
   setTimeout(() => {
      div.innerHTML += `<a href="https://www.ilovecats.com">Link</a>`;
   }, 2000)
   setTimeout(() => {
      div.innerHTML += `<label>blah blah</label> `;
   }, 4000)
   setTimeout(() => {
      div.innerHTML += `<input type="text" value="I love cats!">`;
   }, 8000)
   function ensureDocumentAccessible() {
      return new Promise((resolve) => {
         const checkHead = setInterval(() => {
            if (document && document.head) {
               clearInterval(checkHead);
               resolve();
            }
         }, 50);
      });
   }

   async function waitForElement(selector, duration = 800, maxTries = 20, multiple = false) {
      await ensureDocumentAccessible(); // Ensure document is ready
      return new Promise((resolve, reject) => {
         let attempts = 0;
         const intervalId = setInterval(() => {
            const elements = multiple ? document.querySelectorAll(selector) : document.querySelector(selector);
            if ((multiple && elements.length > 0) || (!multiple && elements)) {
               clearInterval(intervalId);
               resolve(elements);
            } else if (++attempts > maxTries) {
               clearInterval(intervalId);
               reject(`Timeout: Unable to find element(s) for selector "${selector}" after ${maxTries} tries.`);
            }
         }, duration);
      });
   }

   async function waitForPageLoad() {
      await ensureDocumentAccessible();
      return new Promise((resolve) => {
         if (document.readyState === "complete" || document.readyState === "interactive") {
            resolve();
         } else {
            document.addEventListener("DOMContentLoaded", resolve, { once: true });
         }
      });
   }

   waitForElement('a').then((elem) => {
      console.log('Element is ready: ', elem.href);
   });
   waitForElement('label').then((elem) => {
      console.log('Element is ready: ', elem.textContent);
   });
   waitForElement('input').then((elem) => {
      console.log('Element is ready: ', elem.value);
   });
</script>

</html>
