<!DOCTYPE html>
<html>

<head>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <table id="myTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Salary</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>25</td>
            <td data-salary="50000">$50,000</td>
            <td>USA</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>30</td>
            <td data-salary="60000">$60,000</td>
            <td>Canada</td>
        </tr>
        <tr>
            <td>Charlie</td>
            <td>22</td>
            <td data-salary="40000">£40,000</td>
            <td>UK</td>
        </tr>
        <tr>
            <td>David</td>
            <td>35</td>
            <td data-salary="75000">$75,000</td>
            <td>Australia</td>
        </tr>
        <tr>
            <td>Eve</td>
            <td>28</td>
            <td data-salary="55000">£55,000</td>
            <td>UK</td>
        </tr>
    </table>


    <button onclick="addRandomRows()">Add Random Rows</button>
    <button id="disengage">Disengage</button>
</body>
<script src="../libs/SourTable.js"></script>
<script>
    window.addEventListener("load", () => {
        let table = new SourTable(document.getElementById("myTable"));
        table.initiate();
        document.getElementById("disengage").addEventListener("click", () => {
            table.disengage();
            table = null;
        });
    });
    const sampleData = [
        { "name": "Alice", "age": 25, "salary": 50000, "country": "USA" },
        { "name": "Bob", "age": 30, "salary": 60000, "country": "Canada" },
        { "name": "Charlie", "age": 22, "salary": 40000, "country": "UK" },
        { "name": "David", "age": 35, "salary": 75000, "country": "Australia" },
        { "name": "Eve", "age": 28, "salary": 55000, "country": "UK" },
        { "name": "Frank", "age": 32, "salary": 62000, "country": "Germany" },
        { "name": "Grace", "age": 27, "salary": 48000, "country": "France" },
        { "name": "Hannah", "age": 29, "salary": 51000, "country": "Italy" },
        { "name": "Isaac", "age": 31, "salary": 72000, "country": "Spain" },
        { "name": "Jack", "age": 26, "salary": 53000, "country": "Netherlands" },
        { "name": "Katie", "age": 34, "salary": 70000, "country": "Sweden" },
        { "name": "Leo", "age": 23, "salary": 39000, "country": "Norway" },
        { "name": "Mia", "age": 36, "salary": 77000, "country": "Denmark" },
        { "name": "Noah", "age": 29, "salary": 59000, "country": "Finland" },
        { "name": "Olivia", "age": 33, "salary": 68000, "country": "Ireland" },
        { "name": "Paul", "age": 40, "salary": 85000, "country": "USA" },
        { "name": "Quinn", "age": 24, "salary": 41000, "country": "New Zealand" },
        { "name": "Ryan", "age": 38, "salary": 81000, "country": "Canada" },
        { "name": "Sophia", "age": 26, "salary": 52000, "country": "Switzerland" },
        { "name": "Thomas", "age": 37, "salary": 78000, "country": "Belgium" },
        { "name": "Uma", "age": 30, "salary": 61000, "country": "Portugal" },
        { "name": "Victor", "age": 41, "salary": 87000, "country": "USA" },
        { "name": "Wendy", "age": 27, "salary": 49000, "country": "Austria" },
        { "name": "Xavier", "age": 39, "salary": 83000, "country": "Japan" },
        { "name": "Yasmine", "age": 25, "salary": 54000, "country": "Singapore" },
        { "name": "Zack", "age": 28, "salary": 56000, "country": "South Korea" }
    ];


    function addRandomRows() {
        const table = document.getElementById("myTable");

        // Get a random number of rows to add (between 1 and 4)
        const numRowsToAdd = Math.floor(Math.random() * 4) + 1;

        for (let i = 0; i < numRowsToAdd; i++) {
            // Get a random data entry
            const randomData = sampleData[Math.floor(Math.random() * sampleData.length)];

            // Create a new row
            const row = document.createElement("tr");

            // Create and populate cells
            row.innerHTML = `
                    <td>${randomData.name}</td>
                    <td>${randomData.age}</td>
                    <td data-salary="${randomData.salary}">$${randomData.salary.toLocaleString()}</td>
                    <td>${randomData.country}</td>
                `;

            // Append row to table
            table.querySelector("tbody").appendChild(row);
        }
    }

</script>

</html>
